<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Professor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px;
    }
    .form-container {
      max-width: 420px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    label {
      margin-top: 15px;
      display: block;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }
    button {
      margin-top: 25px;
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }
    .msg {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      border-radius: 5px;
      display: none;
    }
    .success {
      background: #dcfce7;
      color: #166534;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h2>Cadastro de Professor</h2>

  <form id="professorForm">
    <!-- schoolId vem pela URL -->
    <input type="hidden" id="schoolId" />

    <label>Nome completo</label>
    <input type="text" id="nome" required />

    <label>Disciplina</label>
    <input type="text" id="disciplina" required />

    <label>Séries que pode lecionar (ex: 6,7,8)</label>
    <input type="text" id="series" required />

    <label>E-mail</label>
    <input type="email" id="email" required />

    <label>WhatsApp</label>
    <input type="text" id="whatsapp" required />

    <button type="submit">Enviar</button>
  </form>

  <div id="successMsg" class="msg success">
    Cadastro enviado com sucesso ✅
  </div>

  <div id="errorMsg" class="msg error">
    Erro ao enviar os dados. Tente novamente.
  </div>
</div>

<script>
  // 1️⃣ Captura o schoolId da URL
  const params = new URLSearchParams(window.location.search);
  const schoolId = params.get("schoolId");
  document.getElementById("schoolId").value = schoolId;

  // 2️⃣ Referências das mensagens
  const successMsg = document.getElementById("successMsg");
  const errorMsg = document.getElementById("errorMsg");

  // 3️⃣ Evento de envio do formulário
  document.getElementById("professorForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    // Esconde mensagens anteriores
    successMsg.style.display = "none";
    errorMsg.style.display = "none";

    const payload = {
      schoolId: schoolId,
      nome: nome.value.trim(),
      disciplina: disciplina.value.trim(),
      series: series.value.trim(),
      email: email.value.trim(),
      whatsapp: whatsapp.value.trim()
    };

    try {
      const response = await fetch("http://localhost:5678/webhook-test/cadastro-professor", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      // 4️⃣ Se o webhook responder erro HTTP
      if (!response.ok) {
        throw new Error("Erro HTTP");
      }

      const result = await response.json();

      // 5️⃣ Se o n8n avisar erro lógico
      if (result.status !== "success") {
        throw new Error(result.message || "Erro desconhecido");
      }

      // 6️⃣ Sucesso
      successMsg.style.display = "block";
      document.getElementById("professorForm").reset();

    } catch (error) {
      console.error(error);
      errorMsg.style.display = "block";
    }
  });
</script>

</body>
</html>
